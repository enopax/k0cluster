apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # 1. HelmRepository sources first (required by ProviderTemplate + ClusterTemplates)
  - helm-caph-repo.yaml
  - helm-standalone-cp-repo.yaml
  - helm-hosted-cp-repo.yaml
  # 2. ProviderTemplate BEFORE Management (Management references it by name)
  - hetzner-providertemplate.yaml
  # 3. Management object (updates k0rdent providers list)
  - management.yaml
  # 4. ClusterTemplates (depend on their HelmRepositories being ready)
  - hetzner-standalone-clustertemplate.yaml
  - hetzner-hosted-clustertemplate.yaml
  # 5. Credential (references Secret which must be created manually)
  - credential.yaml
  # secret.yaml intentionally excluded:
  # It contains ${envsubst} placeholders and must be created manually:
  #   kubectl create secret generic hcloud-cluster-provisioning-token \
  #     --from-literal=hcloud-token="$(rbw get 'www.hetzner.com api key')" \
  #     --namespace kcm-system
  #   kubectl label secret hcloud-cluster-provisioning-token -n kcm-system \
  #     k0rdent.mirantis.com/component=kcm
