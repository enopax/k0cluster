apiVersion: k0rdent.mirantis.com/v1beta1
kind: Credential
metadata:
  labels:
    k0rdent.mirantis.com/component: kcm
  name: stackit-eu01
  namespace: kcm-system
spec:
  description: STACKIT service account for cluster provisioning in eu01
  # Direkt auf das Secret, ohne ClusterIdentity dazwischen: StackIT hat kein
