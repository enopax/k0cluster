# Der Service-Account-Schluessel von StackIT.
#
# Zwei Schluessel in einem Secret, und beide Namen sind von CAPSTK vorgegeben:
# `project-id` und `serviceaccount.json`. Anders als bei Hetzner gibt es keine
# ClusterIdentity-CRD - das k0rdent-Credential zeigt direkt hierauf.
#
# Erzeugen (envsubst wie bei secret.yaml):
#   export CLUSTER_NAMESPACE=kcm-system
#   export STACKIT_PROJECT_ID=<uuid>
#   export STACKIT_SERVICE_ACCOUNT_JSON_B64="$(base64 < sa_key.json | tr -d '\n')"
#   envsubst < manifests/mgmt/stackit-secret.yaml | kubectl apply -f -
#
# Der Service-Account braucht eine **eigene Projektrolle**, nicht
# Projektadministrator. Die 26 Rechte, die CAPSTK wirklich benutzt, stehen in
# dessen Dokumentation unter "IAM permissions" (iaas.server.*, iaas.network.*,
# iaas.security-group.*, iaas.public-ip.*, nlb.loadbalancer.*,
# nlb.targetpool.replace). Was der CCM des Kindclusters zusaetzlich braucht,
# steht dort nicht und ist beim ersten Load Balancer zu ermitteln.
apiVersion: v1
kind: Secret
metadata:
  name: stackit-eu01-credentials
  namespace: ${CLUSTER_NAMESPACE}
  labels:
    k0rdent.mirantis.com/component: kcm
type: Opaque
data:
  project-id: ${STACKIT_PROJECT_ID_BASE64}
  serviceaccount.json: ${STACKIT_SERVICE_ACCOUNT_JSON_B64}
