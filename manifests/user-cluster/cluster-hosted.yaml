apiVersion: k0rdent.mirantis.com/v1beta1
kind: ClusterDeployment
metadata:
  name: cluster-hosted
  namespace: kcm-system
spec:
  template: hetzner-hosted-cp-1-3-0
  credential: hcloud-cluster-provisioning
  dryRun: false
  cleanupOnDeletion: false
  config:
    clusterName: cluster-hosted

    # Hetzner region
    region: nbg1

    # SSH key for node access (single key name, not array)
    sshKeyName: "deploy"

    # Hetzner API token secret name
    hetznerSecretName: hetzner

    # Cluster network
    clusterNetwork:
      pods:
        cidrBlock: "10.244.0.0/16"
      services:
        cidrBlock: "10.96.0.0/12"

    # Worker node configuration
    worker:
      serverType: cpx22
      imageName: ubuntu-24.04
      replicas: 1

    # Ingress for hosted control plane access
    ingress:
      enabled: true
      apiHost: cluster-hosted-api.k0s.targz.de
      konnectivityHost: cluster-hosted-konnectivity.k0s.targz.de
      className: haproxy
      port: 443
      annotations:
        haproxy.org/ssl-passthrough: "true"

    # k0s configuration
    k0s:
      version: v1.35.4+k0s.0
