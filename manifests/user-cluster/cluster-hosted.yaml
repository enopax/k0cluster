apiVersion: k0rdent.mirantis.com/v1beta1
kind: ClusterDeployment
metadata:
  name: cluster-hosted
  namespace: kcm-system
spec:
  template: hetzner-hosted-cp-1-3-17
  credential: hcloud-cluster-provisioning
  dryRun: false
  cleanupOnDeletion: true
  config:
    clusterName: cluster-hosted

    # Hetzner region
    region: nbg1

    # SSH key for node access
    sshKeyName: deploy

    # Cluster network
    clusterNetwork:
      pods:
        cidrBlock: "10.244.0.0/16"
      services:
        cidrBlock: "10.96.0.0/12"

    # Worker node configuration
    worker:
      serverType: cpx22
      imageName: ubuntu-24.04
      replicas: 1

    # Control plane access via ingress
    ingress:
      enabled: true
      apiHost: cluster-hosted-api.k0s.targz.de
      konnectivityHost: cluster-hosted-konnectivity.k0s.targz.de

    # k0s configuration
    k0s:
      version: v1.35.4+k0s.0
