apiVersion: k0rdent.mirantis.com/v1beta1
kind: ClusterDeployment
metadata:
  name: cluster-hosted
  namespace: kcm-system
spec:
  template: hetzner-hosted-cp-1-0-0
  credential: hcloud-cluster-provisioning
  dryRun: false
  cleanupOnDeletion: false
  config:
    # Worker configuration
    workersNumber: 2

    # Hosted control plane (runs as pods in management cluster)
    controlPlane:
      replicas: 1
      service:
        type: ClusterIP

    # Cluster network
    clusterNetwork:
      pods:
        cidrBlocks:
          - "10.244.0.0/16"
      services:
        cidrBlocks:
          - "10.96.0.0/12"

    # Optional labels and annotations
    clusterLabels:
      cluster-type: hosted-cp
      environment: dev
    clusterAnnotations: {}

    # Hetzner region (fsn1 unavailable, use nbg1)
    region: nbg1

    # SSH keys for node access
    sshKeyNames:
      - "felix@chump"

    # Hetzner API token reference
    tokenRef:
      name: hcloud-cluster-provisioning-token
      key: hcloud-token

    # Hetzner private network
    hcloudNetwork:
      enabled: true
      cidrBlock: "10.0.0.0/16"
      subnetCidrBlock: "10.0.0.0/24"
      networkZone: "eu-central"

    # Worker node configuration
    worker:
      image: ubuntu-24.04
      type: cpx22

    # k0s configuration
    k0s:
      version: v1.34.3+k0s.0
      network:
        provider: custom
